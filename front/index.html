<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Health Assistant - Login</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
</head>
<body class="auth-body">
  <!-- Floating Circle Decorations -->
  <div class="circle circle-1"></div>
  <div class="circle circle-2"></div>

  <div class="auth-container">
    <div class="auth-header">
      <div class="app-logo">🛡️</div>
      <h1>AI Health Assistant</h1>
      <p class="tagline">Smart. Safe. Preventive Healthcare.</p>
    </div>

    <div class="auth-tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">EXISTING USER</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">+ NEW REGISTRATION</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="auth-form active">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn-primary">🔐 Login &rarr;</button>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="auth-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Enter your name" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="reg-email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Create a password" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Age</label>
          <input type="number" id="reg-age" placeholder="Age" required>
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select id="reg-gender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>City</label>
        <input type="text" id="reg-city" placeholder="e.g. Coimbatore" required>
      </div>
      <button type="submit" class="btn-primary">Register &rarr;</button>
    </form>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
